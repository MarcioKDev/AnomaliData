[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anomalidata"
version = "0.1.0"
description = "Detecção de anomalias em registros de compras"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Marcio Kauã Ferreira de Campos" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

